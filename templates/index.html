<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encryption & Decryption App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Encryption & Decryption App</h1>
        <form method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="text">Enter Text:</label>
                <textarea class="form-control" id="text" name="text" rows="3" placeholder="Enter text here..."></textarea>
            </div>
            <div class="form-group">
                <label for="file">Or Upload File:</label>
                <input type="file" class="form-control-file" id="file" name="file">
            </div>
            <div class="form-group">
                <label for="algorithm">Select Algorithm:</label>
                <select class="form-control" id="algorithm" name="algorithm">
                    <option value="fernet">Fernet</option>
                    <option value="aes">AES</option>
                    <option value="caesar">Caesar Cipher</option>
                </select>
            </div>
            <div class="buttons text-center">
                <button type="submit" name="action" value="encrypt" class="btn btn-primary">Encrypt</button>
                <button type="submit" name="action" value="decrypt" class="btn btn-secondary">Decrypt</button>
            </div>
        </form>
        {% if result %}
        <div class="result mt-4">
            <h2>{{ action }} Result:</h2>
            {% if filename %}
            <p>File processed: <a href="{{ url_for('download', filename=filename) }}" class="btn btn-success">Download {{ filename }}</a></p>
            {% else %}
            <p>{{ result }}</p>
            {% endif %}
        </div>
        {% endif %}
    </div>
</body>
</html>
